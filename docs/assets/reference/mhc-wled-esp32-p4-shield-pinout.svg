<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 626" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .board  { fill:#16351f; stroke:#0c2013; stroke-width:2; }
    .blk    { fill:#2f7d43; stroke:#1c4a28; stroke-width:1.5; }
    .term   { fill:#123a1c; stroke:#8fe0a3; stroke-width:1; }
    .lbl    { fill:#eaf5ec; font-size:13px; font-weight:600; text-anchor:middle; }
    .gpio   { fill:#eaf5ec; font-size:14px; font-weight:700; text-anchor:middle; }
    .role   { fill:#bfe9cb; font-size:11px; text-anchor:middle; }
    .title  { fill:#eaf5ec; font-size:16px; font-weight:700; text-anchor:middle; }
    .cap    { fill:#b7c4bb; font-size:12px; text-anchor:middle; }
    .out    { fill:#2f7d43; }
    .rs485  { fill:#8a5a1e; }
    .io     { fill:#8a2f2f; }
    .audio  { fill:#3a5f8a; }
    .warn   { fill:#f2a6a6; font-size:12px; font-weight:700; text-anchor:middle; }
  </style>

  <rect x="8" y="8" width="964" height="610" rx="10" class="board"/>
  <text x="490" y="34" class="lbl" font-size="17">MHC-WLED ESP32-P4 shield (V2 / v1.0) — terminal pinout</text>
  <text x="490" y="52" class="role">read from the board silkscreen · GPIO numbers are the ESP32-P4 pins</text>

  <!-- ============ Row A: 12x level-shifted OUTPUTS (blocks 1 + 2) ============ -->
  <text x="300" y="86" class="title" fill="#eaf5ec">12x outputs — level-shifted, single-ended (LED data)</text>

  <!-- block 1: O21 O20 O25 O5 O7 O23 O8 -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="420" height="70" rx="4" class="blk out"/>
    <!-- 7 terminals -->
    <g>
      <!-- generated columns -->
      <g transform="translate(30,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">21</text></g>
      <g transform="translate(90,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">20</text></g>
      <g transform="translate(150,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">25</text></g>
      <g transform="translate(210,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">5</text></g>
      <g transform="translate(270,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">7</text><text x="0" y="-2" class="role">I²C SCL·SDA</text></g>
      <g transform="translate(330,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">23</text></g>
      <g transform="translate(390,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">8</text></g>
    </g>
  </g>

  <!-- block 2: O27 O3 O22 O24 O4 GND -->
  <g transform="translate(500,100)">
    <rect x="0" y="0" width="360" height="70" rx="4" class="blk out"/>
    <g>
      <g transform="translate(30,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term"/><text x="0" y="40" class="gpio">27</text></g>
      <g transform="translate(90,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term" stroke="#f2c98a" stroke-width="2.5"/><text x="0" y="40" class="gpio">3</text></g>
      <g transform="translate(150,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term" stroke="#f2c98a" stroke-width="2.5"/><text x="0" y="40" class="gpio">22</text></g>
      <g transform="translate(210,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term" stroke="#f2c98a" stroke-width="2.5"/><text x="0" y="40" class="gpio">24</text></g>
      <g transform="translate(270,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term" stroke="#f2c98a" stroke-width="2.5"/><text x="0" y="40" class="gpio">4</text></g>
      <g transform="translate(330,0)"><rect x="-18" y="12" width="36" height="46" rx="3" class="term" fill="#3a3a3a" stroke="#999"/><text x="0" y="40" class="gpio">GND</text></g>
    </g>
  </g>
  <text x="680" y="186" class="role" fill="#f2c98a" font-size="11.5">amber outline = same GPIO also wired to an RS-485 channel (below)</text>

  <!-- ============ Row B: 4x RS-485 differential — full width, each channel = 2 screw terminals (A,B) ============ -->
  <text x="40" y="226" class="title" text-anchor="start" font-size="15">4x RS-485 — each channel = 2 screw terminals (A + B), a differential transceiver pair, NOT a bare GPIO</text>
  <g transform="translate(40,240)">
    <rect x="0" y="0" width="900" height="86" rx="4" class="blk rs485"/>
    <!-- 4 channels evenly spread; each channel = 2 terminals (A,B), GPIO label above -->
    <g transform="translate(40,0)">
      <text x="55" y="10" class="gpio" font-size="13">GPIO 4</text>
      <rect x="14" y="16" width="34" height="54" rx="3" class="term"/><text x="31" y="48" class="lbl">A</text>
      <rect x="62" y="16" width="34" height="54" rx="3" class="term"/><text x="79" y="48" class="lbl">B</text>
    </g>
    <g transform="translate(255,0)">
      <text x="55" y="10" class="gpio" font-size="13">GPIO 22</text>
      <rect x="14" y="16" width="34" height="54" rx="3" class="term"/><text x="31" y="48" class="lbl">A</text>
      <rect x="62" y="16" width="34" height="54" rx="3" class="term"/><text x="79" y="48" class="lbl">B</text>
    </g>
    <g transform="translate(470,0)">
      <text x="55" y="10" class="gpio" font-size="13">GPIO 24</text>
      <rect x="14" y="16" width="34" height="54" rx="3" class="term"/><text x="31" y="48" class="lbl">A</text>
      <rect x="62" y="16" width="34" height="54" rx="3" class="term"/><text x="79" y="48" class="lbl">B</text>
    </g>
    <g transform="translate(685,0)">
      <text x="55" y="10" class="gpio" font-size="13">GPIO 3</text>
      <rect x="14" y="16" width="34" height="54" rx="3" class="term"/><text x="31" y="48" class="lbl">A</text>
      <rect x="62" y="16" width="34" height="54" rx="3" class="term"/><text x="79" y="48" class="lbl">B</text>
    </g>
  </g>
  <!-- loopback wiring: A4->A3 and B4->B3 (straight, NOT crossed) -->
  <!-- A4 center x = 40+40+31 = 111 ; A3 = 40+685+31 = 756 ; B4 = 40+40+79 = 159 ; B3 = 40+685+79 = 804 ; block bottom y = 326 -->
  <path d="M 111 328 C 111 372, 756 372, 756 328" fill="none" stroke="#f2c98a" stroke-width="2.5"/>
  <path d="M 159 336 C 159 358, 804 358, 804 336" fill="none" stroke="#8fd0f2" stroke-width="2.5"/>
  <text x="490" y="392" class="lbl" fill="#f2c98a" font-size="12.5">loopback: A4 → A3 (amber)  ·  B4 → B3 (blue)  —  straight A→A, B→B, never crossed</text>

  <!-- ============ Row C: 4x in/out header (diode + low-pass) — its OWN row ============ -->
  <text x="40" y="428" class="title" text-anchor="start" font-size="15">4x in/out — diode + ~16 kHz low-pass (button inputs), NOT for a WS2812 loopback</text>
  <g transform="translate(40,442)">
    <rect x="0" y="0" width="420" height="60" rx="4" class="blk io"/>
    <g transform="translate(34,0)"><rect x="-18" y="10" width="36" height="42" rx="3" class="term"/><text x="0" y="37" class="gpio">46</text></g>
    <g transform="translate(90,0)"><rect x="-18" y="10" width="36" height="42" rx="3" class="term"/><text x="0" y="37" class="gpio">47</text></g>
    <g transform="translate(146,0)"><rect x="-18" y="10" width="36" height="42" rx="3" class="term"/><text x="0" y="37" class="gpio">2</text></g>
    <g transform="translate(202,0)"><rect x="-18" y="10" width="36" height="42" rx="3" class="term"/><text x="0" y="37" class="gpio">48</text></g>
    <g transform="translate(258,0)"><rect x="-18" y="10" width="36" height="42" rx="3" class="term" fill="#3a3a3a" stroke="#999"/><text x="0" y="37" class="lbl">GND</text></g>
    <g transform="translate(316,0)"><rect x="-22" y="10" width="44" height="42" rx="3" class="term" fill="#4a3a1a" stroke="#c9a25a"/><text x="0" y="37" class="role">In5V</text></g>
    <g transform="translate(372,0)"><rect x="-24" y="10" width="48" height="42" rx="3" class="term" fill="#4a3a1a" stroke="#c9a25a"/><text x="0" y="37" class="role">Out3V3</text></g>
  </g>

  <!-- ============ Row C-right: Ethernet note (same row as 4x in/out) ============ -->
  <text x="720" y="428" class="title" fill="#eaf5ec">Ethernet (RMII, ext clock)</text>
  <g transform="translate(560,442)">
    <rect x="0" y="0" width="380" height="60" rx="4" class="blk" fill="#254a63"/>
    <text x="190" y="26" class="role" font-size="12.5">MDC 31 · MDIO 52 · RST 51 · CLK 50 (ext-in) · PHYaddr 1</text>
    <text x="190" y="45" class="role" font-size="11">ethType 2 (IP101) · clock external-in</text>
  </g>

  <!-- ============ Row D: Line-In audio (PCM1808) ============ -->
  <text x="40" y="536" class="title" text-anchor="start" font-size="15">Line-In audio (PCM1808 → I²S)</text>
  <g transform="translate(40,550)">
    <rect x="0" y="0" width="420" height="60" rx="4" class="blk audio"/>
    <g transform="translate(58,0)"><rect x="-34" y="10" width="68" height="42" rx="3" class="term"/><text x="0" y="36" class="gpio">32</text><text x="0" y="-2" class="role">SCK</text></g>
    <g transform="translate(160,0)"><rect x="-34" y="10" width="68" height="42" rx="3" class="term"/><text x="0" y="36" class="gpio">26</text><text x="0" y="-2" class="role">WS</text></g>
    <g transform="translate(262,0)"><rect x="-34" y="10" width="68" height="42" rx="3" class="term"/><text x="0" y="36" class="gpio">33</text><text x="0" y="-2" class="role">SD</text></g>
    <g transform="translate(364,0)"><rect x="-34" y="10" width="68" height="42" rx="3" class="term"/><text x="0" y="36" class="gpio">36</text><text x="0" y="-2" class="role">MCLK</text></g>
  </g>

  <!-- ============ Loopback callout ============ -->
  <rect x="500" y="522" width="440" height="88" rx="8" fill="#12251a" stroke="#f2c98a" stroke-width="1.5"/>
  <text x="518" y="544" class="lbl" text-anchor="start" fill="#f2c98a" font-size="13">Loopback test (RS-485 path, per shield builder)</text>
  <text x="518" y="564" class="role" text-anchor="start" font-size="12">Tx = GPIO 4 (A-4-B) → Rx = GPIO 3 (A-3-B). Two cables:</text>
  <text x="518" y="580" class="role" text-anchor="start" font-size="12">A4→A3 and B4→B3 (straight, never crossed). No switch —</text>
  <text x="518" y="596" class="role" text-anchor="start" font-size="12">GPIO 3's direction is firmware-set. Through 2 transceivers,</text>
  <text x="518" y="612" class="role" text-anchor="start" font-size="12">so a fail is a transceiver-bandwidth limit, not firmware.</text>
</svg>
