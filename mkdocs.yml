# Docs site config — Material for MkDocs. Phase 0 of the docs overhaul
# (docs/backlog/docs-system-overhaul.md): render the EXISTING docs as a
# navigable, searchable site at the Pages root, with zero content changes.
# The `nav:` below imposes a top-down end-user → developer order over files
# that already exist; nothing here moves or rewrites a doc.
#
# Built in CI (release.yml deploy-pages job) into pages/ root; the web
# installer keeps its /install/ path untouched. Build locally with
#   uv run scripts/docs/build_docs.py --strict
site_name: projectMM
site_description: High-performance LED & DMX lighting control for ESP32 and beyond.
# Canonical deployed URL: the custom domain, with the /projectMM/ repo subpath
# kept (GitHub Pages serves the project site under that path even on the custom
# domain — every existing link uses moonmodules.org/projectMM/…, e.g. the
# installer at /projectMM/install/). Drives the sitemap, canonical <link> tags,
# and the base for absolute URLs.
site_url: https://moonmodules.org/projectMM/
repo_url: https://github.com/MoonModules/projectMM
repo_name: MoonModules/projectMM
edit_uri: edit/main/docs/

# Flat output (foo.md → foo.html), NOT MkDocs' default directory URLs
# (foo.md → foo/index.html). The docs' relative links (image `<img src>`, source
# links) were hand-authored with `../` counts that match the FLAT layout — the
# same counts GitHub uses when viewing the raw .md. Directory URLs add one path
# level and break every relative asset link by one hop (a `../../../assets/…`
# preview resolves to `/moonmodules/assets/…` and 404s). Keeping flat URLs makes
# the same links resolve in BOTH the rendered site and GitHub's raw view — one
# link that works everywhere, no per-file rewrite.
use_directory_urls: false

theme:
  name: material
  palette:
    # Dark theme matching the retired landing page's accent (#a78bfa).
    scheme: slate
    primary: deep purple
    accent: deep purple
  features:
    - navigation.instant   # SPA-style nav, no full reload
    - navigation.tracking  # URL reflects the active anchor
    - navigation.top       # back-to-top button
    - navigation.sections  # top-level nav groups render as sections
    - search.suggest
    - search.highlight
    - content.code.copy    # copy button on code blocks (matters once snippets land)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  # Renders Material icon shortcodes (`:material-flash:` → the ⚡ glyph) used on
  # the landing page's buttons and card grid. Without this they show as literal
  # text. The emoji_index/generator pair is Material's documented icon setup.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Snippets is the Phase-3 de-duplication mechanism: `--8<--` pulls real
  # source lines into a doc so a fact lives once (in the .h) and renders in
  # the .md. Enabled now (harmless with no snippets yet) so later phases need
  # no config change. base_path lets a snippet reference src/ from the repo root.
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true

plugins:
  - search

# history/ and backlog/ are internal (CLAUDE.md: agents read them only when
# planning; they're not end-user or developer reference), and they're transient
# — compacted away over time. Keep them out of the built site entirely, not
# merely off the nav. (The web installer is a separate app under the top-level
# web-installer/, outside docs_dir, so MkDocs never sees it — nothing to exclude.)
exclude_docs: |
  history/
  backlog/

# Link validation: warn (don't fail) on cross-doc anchors. The existing docs
# carry a backlog of links to renamed/removed section anchors — surfacing them
# is useful, but fixing ~400 of them is its own cleanup, not this additive
# site-standup. Phase 0 fails the build only on missing *files* / bad nav, not
# stale anchors. (A later phase can flip anchors to `error` once swept.)
validation:
  nav:
    omitted_files: ignore    # history/backlog intentionally absent from nav
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore

# Top-down navigation over the existing files. Two audiences, in order:
# a user path first (what it is → install → use → effects), then the developer
# reference (architecture → modules → source-level). history/ and backlog/ are
# internal and deliberately absent from the published site.
nav:
  - Home: index.md
  - Getting started:
      - Install & first light: gettingstarted.md
      # The web installer is a separate app deployed at /install/ (staged
      # verbatim by the release workflow, not built by MkDocs). Link out to it.
      - Web installer: /install/
  - Effects & building shows:
      - Effects: moonmodules/light/effects/effects.md
      - Layouts: moonmodules/light/layouts/layouts.md
      - Modifiers: moonmodules/light/modifiers/modifiers.md
      - Drivers: moonmodules/light/drivers/drivers.md
      - Live scripting: moonmodules/light/moonlive/MoonLiveEffect.md
  - Tests (what we verify):
      - Unit tests: tests/unit-tests.md
      - Scenario tests: tests/scenario-tests.md
  - Developer reference:
      - Architecture: architecture.md
      - Coding standards: coding-standards.md
      - Building: building.md
      - Testing strategy: testing.md
      - Performance: performance.md
      - Core modules:
          - MoonModule (base): moonmodules/core/MoonModule.md
          - Control: moonmodules/core/Control.md
          - Scheduler: moonmodules/core/Scheduler.md
          - System: moonmodules/core/SystemModule.md
          - Network: moonmodules/core/NetworkModule.md
          - HTTP server: moonmodules/core/HttpServerModule.md
          - Improv provisioning: moonmodules/core/ImprovProvisioningModule.md
          - Firmware update: moonmodules/core/FirmwareUpdateModule.md
          - Devices: moonmodules/core/DevicesModule.md
          - Filesystem: moonmodules/core/FilesystemModule.md
          - Audio: moonmodules/core/AudioModule.md
          - I2C scan: moonmodules/core/I2cScanModule.md
          - UI: moonmodules/core/ui.md
      - Light pipeline:
          - Effect base: moonmodules/light/EffectBase.md
          - Modifier base: moonmodules/light/ModifierBase.md
          - Layer: moonmodules/light/Layer.md
          - Layers: moonmodules/light/Layers.md
          - Layouts (container): moonmodules/light/Layouts.md
          - Drivers (container): moonmodules/light/Drivers.md
          - Buffer: moonmodules/light/Buffer.md
          - Blend map: moonmodules/light/BlendMap.md
          - Mapping LUT: moonmodules/light/MappingLUT.md
          - Light config: moonmodules/light/LightConfig.md
      - Drivers (detail):
          - RMT LED: moonmodules/light/drivers/RmtLedDriver.md
          - Parlio LED: moonmodules/light/drivers/ParlioLedDriver.md
          - LCD LED: moonmodules/light/drivers/LcdLedDriver.md
          - Network send: moonmodules/light/drivers/NetworkSendDriver.md
          - Preview: moonmodules/light/drivers/PreviewDriver.md
          - Hue: moonmodules/light/drivers/HueDriver.md
      - Hardware reference:
          - ESP32-S31 coreboard: reference/esp32-s31-coreboard.md
